# scaffold.yml - Configuration for the scaffold tool
# YAML keys use kebab-case; serde translates to snake_case in Rust

# Default author information for generated Cargo.toml files
default-author: "Scott Idler <scott.a.idler@gmail.com>"

# Default license for generated projects
default-license: MIT

# Whether to initialize git repositories in generated projects
create-git-repo: true

# Whether to create sample config files in generated projects
create-sample-config: true

# Enable debug logging
debug: false

# GitHub Actions reusable-workflow wiring for generated projects.
# The generated .github/workflows/{ci,release}.yml are thin callers that `uses:`
# the reusable workflows in <org>/github-actions. The org is normally auto-detected
# from the target repo's git remote (origin); these are the fallbacks.
workflow:
  # Org hosting the reusable workflows when it can't be detected from the git remote.
  # The reusable repo is always "<default-org>/github-actions".
  # Override per-run with --org (e.g. --org tatari-tv).
  default-org: scottidler
  # Git ref (tag/branch) the generated callers pin the reusable workflows to.
  # Override per-run with --workflow-ref (e.g. --workflow-ref v5 for tatari-tv).
  ref: v1

# Template configuration - controls what gets generated
template:
  # Default project structure
  create-build-rs: true
  create-cli-module: true
  create-config-module: true

  # Default dependencies to add via cargo add
  dependencies:
    - name: clap
      features: [derive]
    - name: eyre
    - name: log
    - name: env_logger
    - name: serde
      features: [derive]
    - name: serde_yaml
    - name: dirs
    - name: colored

  # Sample config values for generated projects
  sample-config:
    name: John Doe
    age: 30
    debug: false

  # Default CLI structure
  cli:
    after-help: "Logs are written to: ~/.local/share/{{PROJECT}}/logs/{{PROJECT}}.log"
